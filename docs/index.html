<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WholeNewtrition</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18221b;
      --muted: #5b675f;
      --paper: #fbfaf5;
      --card: #ffffff;
      --line: #d9ded2;
      --accent: #2f6f4e;
      --accent-soft: #e7f1ea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 28px 16px 48px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 9vw, 52px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 18px;
    }

    .links {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    a {
      display: block;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--card);
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(24, 34, 27, 0.04);
    }

    strong {
      display: block;
      margin-bottom: 4px;
      color: var(--accent);
      font-size: 20px;
    }

    span {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>WholeNewtrition</h1>
    <p>Simple food tools for post-surgery recovery: shop, track what is checked, and pick easy meals.</p>
    <div class="links">
      <a href="./shopping-list/">
        <strong>Shopping List</strong>
        <span>Tap-friendly checklist with saved progress.</span>
      </a>
      <a href="./menu/">
        <strong>Quick Menu</strong>
        <span>What we have, what to eat, and what to buy more of.</span>
      </a>
    </div>
  </main>
</body>
</html>
